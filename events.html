<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Hub | Events</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <img src="Photo/logo.png" alt="Student Hub Logo" width="70" height="70">
        <h1>Student Hub</h1>
        <p>Your Academic Management Portal</p>
        <button id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
    </header>

    <hr>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact Us</a>
        <a href="FQA.html">FAQ</a>
    </nav>

    <hr>

    <main>

        <h2>Upcoming Events</h2>

        <!-- Search, Filter and Sort -->
        <div class="event-controls">

            <input
                type="text"
                id="searchEvent"
                placeholder="Search event..."
            >

            <select id="categoryFilter">
                <option value="All">All Categories</option>
                <option value="Technical">Technical</option>
                <option value="Cultural">Cultural</option>
                <option value="Sports">Sports</option>
                <option value="Workshop">Workshop</option>
            </select>

            <select id="sortEvent">
                <option value="dateAsc">Date: Earliest First</option>
                <option value="dateDesc">Date: Latest First</option>
                <option value="name">Name: A-Z</option>
            </select>

        </div>

        <!-- Loading Message -->
        <p id="loadingMessage">Loading events...</p>

        <!-- Events will come here from JSON -->
        <div id="eventList"></div>

        <!-- Pagination -->
        <div class="event-pagination">

            <button id="prevBtn">Previous</button>

            <span id="pageInfo">Page 1</span>

            <button id="nextBtn">Next</button>

        </div>

        <!-- Modal -->
        <div id="eventModal" class="modal">

            <div class="modal-content">

                <span class="close">&times;</span>

                <h2 id="modalTitle"></h2>

                <p>
                    <b>Date:</b>
                    <span id="modalDate"></span>
                </p>

                <p>
                    <b>Venue:</b>
                    <span id="modalVenue"></span>
                </p>

                <p>
                    <b>Category:</b>
                    <span id="modalCategory"></span>
                </p>

                <p id="modalDescription"></p>

                <button id="closeBtn">Close</button>

            </div>

        </div>

    </main>

    <hr>

    <footer>
        <p><strong>Student Hub</strong></p>
        <p>Email: support@studenthub.com</p>
        <p>© 2026 Student Hub. All Rights Reserved.</p>
    </footer>

    <!-- <script src="js/script.js"></script> -->
    <script src="js/event.js"></script>

</body>
</html>
